name: Windows font compatibility

on:
  push:
    branches: [main]
    paths:
      - tools/compact_font.py
      - tools/*windows*
      - .github/workflows/windows-font-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directwrite-and-chromium:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install "fonttools[woff]==4.65.0"
      - name: Compile native DirectWrite check
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /W4 /Fe:windows_font_check.exe tools/windows_font_check.cpp dwrite.lib ole32.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare old names, control name and WWS declaration
        run: python tools/check_windows_compatibility.py --native windows_font_check.exe --install-ci-fonts
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install chromium
      - name: Verify actual Chromium canvas matching for all styles
        run: node tools/check_windows_canvas.cjs
      - name: Preserve reports and candidate fonts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-font-compatibility
          path: |
            dist/windows-check/*.json
            dist/windows-check/fixed/*.ttf
          if-no-files-found: warn
