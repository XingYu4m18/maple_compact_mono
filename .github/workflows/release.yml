name: Build and publish fonts

on:
  push:
    tags: ['v[0-9]*', 'resume/v[0-9]*']
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Maple Mono stable version, or latest'
        required: true
        default: latest
        type: string
      release_tag:
        description: 'Optional output tag, e.g. v7.9-compact.1 (upstream remains v7.9)'
        required: false
        default: ''
        type: string
      resume_draft:
        description: 'Reuse a complete draft only when font-generation inputs match its tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: compact-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      tag: ${{ steps.catalog.outputs.tag }}
      upstream_tag: ${{ steps.catalog.outputs.upstream_tag }}
      resume: ${{ steps.catalog.outputs.resume }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - id: catalog
        name: Resolve upstream packages
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.upstream_version }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_RESUME: ${{ inputs.resume_draft }}
        run: |
          RESUME=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            RELEASE_TAG="${GITHUB_REF_NAME#resume/}"
            VERSION="${RELEASE_TAG%-compact.*}"
            if [[ "$GITHUB_REF_NAME" == resume/* ]]; then RESUME=true; fi
          else
            VERSION="$INPUT_VERSION"
            RELEASE_TAG="$INPUT_TAG"
            RESUME="${INPUT_RESUME:-false}"
          fi
          echo "resume=$RESUME" >> "$GITHUB_OUTPUT"
          EXTRA_ARGS=()
          if [ -n "$RELEASE_TAG" ]; then EXTRA_ARGS+=(--release-tag "$RELEASE_TAG"); fi
          python tools/build_compact.py --upstream-version "$VERSION" "${EXTRA_ARGS[@]}" --catalog-only --output-dir dist
          python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path('dist/catalog.json').read_text())
          matrix = json.loads(Path('dist/matrix.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tag=' + catalog['release_tag'] + '\n')
              f.write('upstream_tag=' + catalog['tag'] + '\n')
              f.write('matrix=' + json.dumps(matrix) + '\n')
          PY
      - name: Verify completed draft and identical font-generation inputs
        if: steps.catalog.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.catalog.outputs.tag }}
        run: |
          git fetch origin tag "$TAG"
          git diff --exit-code "$TAG" HEAD -- tools/compact_font.py tools/build_compact.py requirements.txt upstream.release.json OFL.txt THIRD_PARTY_NOTICES.md licenses/
          gh release view "$TAG" --json isDraft,assets > dist/existing-draft.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('dist/catalog.json').read_text())
          release = json.loads(Path('dist/existing-draft.json').read_text())
          assert release['isDraft'], 'Never resume or replace a published release'
          actual = {a['name'] for a in release['assets'] if a['size'] > 0}
          expected = {name for p in catalog['packages'] for name in (p['output'], p['output'][:-4] + '.sha256')}
          assert actual == expected, 'Draft is incomplete; use the full build workflow'
          print('Verified existing draft:', len(actual), 'assets; font-generation inputs unchanged')
          PY
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.catalog.outputs.tag }}
          RESUME: ${{ steps.catalog.outputs.resume }}
        run: |
          if gh release view "$TAG" --json isDraft > dist/release.json 2>/dev/null; then
            python -c "import json; assert json.load(open('dist/release.json'))['isDraft'], 'Release already published; do not overwrite it'"
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            if [ "$RESUME" = true ]; then echo '::error::Draft must already exist when resuming'; exit 1; fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Maple Compact Mono $TAG" --notes-file dist/release-notes.md --draft
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.resume != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compact and verify every font in package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.upstream_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          python tools/build_compact.py --upstream-version "$VERSION" --release-tag "$RELEASE_TAG" --asset "$ASSET" --output-dir dist
      - name: Upload verified package and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          COMPACT_ASSET="${ASSET/MapleMono/MapleCompactMono}"
          gh release upload "$TAG" "dist/$COMPACT_ASSET" "dist/${COMPACT_ASSET%.zip}.sha256" --clobber

  windows:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.prepare.outputs.resume == 'true' && needs.build.result == 'skipped'))
    uses: ./.github/workflows/windows-font-check.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build, windows]
    if: always() && needs.prepare.result == 'success' && needs.windows.result == 'success' && (needs.build.result == 'success' || (needs.prepare.outputs.resume == 'true' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify release completeness and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          python tools/build_compact.py --upstream-version "$VERSION" --release-tag "$TAG" --catalog-only --output-dir dist
          gh release view "$TAG" --json assets > dist/uploaded.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('dist/catalog.json').read_text())
          uploaded = json.loads(Path('dist/uploaded.json').read_text())['assets']
          actual = {a['name'] for a in uploaded if a['size'] > 0}
          expected = {name for p in catalog['packages'] for name in (p['output'], p['output'][:-4] + '.sha256')}
          assert actual == expected, {'missing': sorted(expected - actual), 'unexpected': sorted(actual - expected)}
          print('Verified release assets:', len(actual))
          PY
          gh release edit "$TAG" --draft=false --latest
